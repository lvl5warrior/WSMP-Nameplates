name: Build

# Builds on every push, and lets you build on demand from the Actions tab.
# The finished jar lands under the run's "Artifacts" section as
# WSMP-Nameplate.zip - download it, unzip, and that's the jar to upload
# to the server's plugins folder.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: WSMP-Nameplate
          path: target/WSMP-Nameplate-*.jar
          if-no-files-found: error
